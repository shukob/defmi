# The EVM half of the deployment question. One number is wanted here: what a
# curve25519 scalar multiplication costs on a chain that has no precompile for
# it. Everything else about a settlement is composed from that and from the
# operation count the Rust verifier reports, because implementing the whole
# verifier in Solidity would be measuring a different program.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# The point-addition formula wants sixteen live 256-bit values, which the
# legacy pipeline cannot hold on the stack. It is also the setting a real
# deployment would use, and it makes the gas figure smaller rather than larger.
via_ir = true
fs_permissions = [{ access = "read-write", path = "../artifacts" }]
