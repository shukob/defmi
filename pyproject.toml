[project]
name = "defmi"
version = "0.1.0"
description = "Delivery versus payment for committed holdings: two legs that move together or not at all."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "zkpi @ git+https://github.com/shukob/zkpi",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["defmi", "evm", "scripts"]
